<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mahbub Alam • Links</title>

<!-- ICONS -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root {
    /* Sky blue gradient background */
    --bg-main: linear-gradient(135deg, #0F2027, #203A43, #2C5364);
    --text-color: #fff;
    --card-bg: rgba(255,255,255,0.15);
    --link-bg: rgba(255,255,255,0.2);
}

body.dark {
    --bg-main: #0e0e0e;
    --text-color: #fff;
    --card-bg: rgba(255,255,255,0.05);
    --link-bg: rgba(255,255,255,0.1);
}

body {
    font-family: "American Typewriter", serif;
    background: var(--bg-main);
    text-align: center;
    padding: 35px;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: 0.4s;
    margin: 0;
    overflow-x: hidden;
}

.container {
    width: 100%;
    max-width: 800px;
    background: var(--card-bg);
    backdrop-filter: blur(15px);
    padding: 80px;
    border-radius: 25px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.25);
    animation: fadeUp 1s ease;
}

/* PROFILE ROW */
.profile-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
}

.profile-info {
    text-align: left;
}

h2 {
    font-size: 40px;
    color: var(--text-color);
    margin-bottom: 5px;
}

.tagline {
    font-size: 25px;
    color: var(--text-color);
    opacity: 0.8;
}

/* Profile Image */
.profile-img {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    border: 5px solid rgba(255,255,255,0.8);
    box-shadow: 0 8px 25px rgba(0,0,0,0.3);
    animation: float 3s ease-in-out infinite;
}

/* LINKS */
a {
    text-decoration: none;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 15px 0;
    padding: 16px;
    color: white;
    font-weight: bold;
    border-radius: 50px;
    transition: 0.3s;
    font-size: 18px;
    background: var(--link-bg);
    position: relative;
    overflow: hidden;
}

a:hover {
    transform: scale(1.05);
    box-shadow: 0 6px 20px rgba(0,0,0,0.3);
}

/* ICON animation */
a:hover i {
    transform: rotate(10deg) scale(1.2);
}

/* ICON spacing */
a i {
    margin-right: 12px;
    font-size: 22px;
    transition: 0.3s;
}

/* Dark Mode Toggle */
.toggle {
    position: absolute;
    top: 20px;
    right: 20px;
    padding: 8px 14px;
    background: rgba(255,255,255,0.3);
    border-radius: 20px;
    cursor: pointer;
    color: white;
    font-weight: bold;
}

/* Animations */
@keyframes fadeUp {
    0% { opacity: 0; transform: translateY(25px); }
    100% { opacity: 1; transform: translateY(0); }
}

@keyframes float {
    0% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
    100% { transform: translateY(0); }
}

/* Responsive */
@media (max-width: 500px) {
    .profile-row {
        flex-direction: row;
        align-items: center;
        gap: 15px;
        text-align: left;
    }
    .profile-img {
        width: 90px;
        height: 90px;
    }
}
</style>
</head>
<body>

<div class="toggle" onclick="toggleDark()">🌙</div>

<div class="container">

    <div class="profile-row">
        <div class="profile-info">
            <h2>Md. Mahbub Alam</h2>
            <div class="tagline">Social Media Links</div>
        </div>
        <img src="myphoto.jpeg" class="profile-img">
    </div>

    <a href="https://facebook.com/mhbxalm" target="_blank"><i class="fab fa-facebook"></i> Facebook</a>
    <a href="https://instagram.com/mhbxalm" target="_blank"><i class="fab fa-instagram"></i> Instagram</a>
    <a href="https://linkedin.com/in/mhbxalm" target="_blank"><i class="fab fa-linkedin"></i> LinkedIn</a>
    <a href="https://x.com/mhbxalm" target="_blank"><i class="fab fa-x-twitter"></i> X (Twitter)</a>
    <a href="https://wa.me/8801731279374" target="_blank"><i class="fab fa-whatsapp"></i> WhatsApp Chat</a>
    <a href="https://www.snapchat.com/add/cdxaxac" target="_blank"><i class="fab fa-snapchat"></i> Snapchat</a>
    <a href="https://t.me/mhbxalm" target="_blank"><i class="fab fa-telegram"></i> Telegram</a>

</div>

<script>
function toggleDark() {
    document.body.classList.toggle("dark");
}
</script>

</body>
</html>
